# Match ~/.config/alacritty/alacritty.toml.

# Fonts
font_family      family="JetBrainsMono Nerd Font Mono" style=Regular
bold_font        family="JetBrainsMono Nerd Font Mono" style=Bold
italic_font      family="JetBrainsMono Nerd Font Mono" style=Italic
bold_italic_font family="JetBrainsMono Nerd Font Mono" style="Bold Italic"
font_size 18.0
disable_ligatures always

# Colors
background #000000
foreground #ffffff
background_opacity 1.0

# Alacritty 0.17 default ANSI palette (not overridden in alacritty.toml).
color0  #181818
color1  #ac4242
color2  #90a959
color3  #f4bf75
color4  #6a9fb5
color5  #aa759f
color6  #75b5aa
color7  #d8d8d8
color8  #6b6b6b
color9  #c55555
color10 #aac474
color11 #feca88
color12 #82b8c8
color13 #c28cb8
color14 #93d3c3
color15 #f8f8f8
dim_opacity 0.66

# Reverse the cell colors for selections and the block cursor.
selection_foreground none
selection_background none
cursor none
cursor_shape block
cursor_blink_interval 0
# Keep shell integration without changing the prompt cursor to a beam.
shell_integration no-cursor

# Scrolling
scrollback_lines 10000
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 3.0

# Window: startup.session maximizes the initial window.
startup_session startup.session

# Match Alacritty's Shift+Return: ESC followed by carriage return.
map shift+enter send_text all \x1b\r
